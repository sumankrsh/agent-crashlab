[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-crashlab"
version = "0.1.0"
description = "Inject timeouts, lost replies, duplicate deliveries and crashes into an agent's tools, and count the side effects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suman Mukherjee" }]
requires-python = ">=3.11"
keywords = ["ai-agents", "fault-injection", "chaos-engineering", "idempotency", "reliability", "testing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agent-crashlab = "agent_crashlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_crashlab"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: Typer declares options as argument defaults.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
